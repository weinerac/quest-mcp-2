<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Apartment Hotels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --quest-blue: #0056b3;
            --quest-light-blue: #e3f2fd;
            --quest-gray: #6c757d;
            --quest-light-gray: #f8f9fa;
            --quest-dark: #2c3e50;
            --quest-success: #28a745;
            --quest-warning: #ffc107;
            --quest-border: #dee2e6;
            --quest-shadow: 0 2px 8px rgba(0,0,0,0.1);
            --quest-shadow-hover: 0 8px 24px rgba(0,0,0,0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--quest-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--quest-shadow);
            margin-bottom: 30px;
        }

        .search-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--quest-dark);
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 2px solid var(--quest-border);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--quest-blue);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        .search-button {
            background: var(--quest-blue);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-button:hover {
            background: #004494;
            transform: translateY(-2px);
            box-shadow: var(--quest-shadow-hover);
        }

        .search-button:disabled {
            background: var(--quest-gray);
            cursor: not-allowed;
            transform: none;
        }

        .hotels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .hotel-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--quest-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hotel-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--quest-shadow-hover);
        }

        .hotel-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0),
                        linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .hotel-content {
            padding: 24px;
        }

        .hotel-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--quest-dark);
            margin-bottom: 8px;
        }

        .hotel-address {
            color: var(--quest-gray);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .hotel-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .stars {
            color: var(--quest-warning);
            font-size: 1.1rem;
        }

        .distance {
            background: var(--quest-light-blue);
            color: var(--quest-blue);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .hotel-amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .amenity-tag {
            background: var(--quest-light-gray);
            color: var(--quest-gray);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .hotel-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--quest-success);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.1rem;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .no-results {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--quest-shadow);
        }

        .no-results h3 {
            color: var(--quest-dark);
            margin-bottom: 12px;
        }

        .no-results p {
            color: var(--quest-gray);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .hotels-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .search-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quest Apartment Hotels</h1>
            <p>Find your perfect accommodation near any location or landmark</p>
        </div>

        <div class="search-section">
            <form class="search-form" id="searchForm">
                <div class="form-group">
                    <label for="location">Location or Landmark</label>
                    <input 
                        type="text" 
                        id="location" 
                        placeholder="e.g., Sydney Opera House, Melbourne Cricket Ground, Brisbane CBD"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="amenities">Amenities (Optional)</label>
                    <select id="amenities" multiple>
                        <option value="Gym">Gym</option>
                        <option value="Pool">Pool</option>
                        <option value="WiFi">WiFi</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Laundry">Laundry</option>
                        <option value="Business Center">Business Center</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="guests">Number of Guests</label>
                    <select id="guests">
                        <option value="">Any</option>
                        <option value="1">1 Guest</option>
                        <option value="2">2 Guests</option>
                        <option value="3">3 Guests</option>
                        <option value="4">4+ Guests</option>
                    </select>
                </div>
                
                <button type="submit" class="search-button">Find Hotels</button>
            </form>
        </div>

        <div id="results">
            <div class="loading">Ready to search for Quest Apartment Hotels...</div>
        </div>
    </div>

    <script type="module" src="./quest-app.ts"></script>
</body>
</html>
