<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest Apartment Hotels</title>
    <style>
      :root {
        color-scheme: light dark;
        --app-ink: var(--color-text-primary, #14213d);
        --app-muted: var(--color-text-secondary, rgba(20, 33, 61, 0.72));
        --app-surface: var(--color-background-primary, #f4efe5);
        --app-panel: var(--color-background-secondary, rgba(255, 255, 255, 0.82));
        --app-line: var(--color-border-primary, rgba(20, 33, 61, 0.14));
        --app-accent: #cb5a2d;
        --app-accent-soft: rgba(203, 90, 45, 0.12);
        --app-shadow: 0 24px 60px rgba(20, 33, 61, 0.14);
        --font-sans-fallback: "Avenir Next", "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--app-ink);
        font-family: var(--font-sans, var(--font-sans-fallback));
        background:
          radial-gradient(circle at top left, rgba(203, 90, 45, 0.22), transparent 24rem),
          radial-gradient(circle at top right, rgba(20, 33, 61, 0.16), transparent 22rem),
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(244, 239, 229, 0.98));
      }

      .shell {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 48px;
      }

      .hero {
        display: grid;
        gap: 18px;
        padding: 24px;
        border: 1px solid var(--app-line);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(250, 246, 240, 0.7));
        box-shadow: var(--app-shadow);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--app-accent);
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3.75rem);
        line-height: 0.96;
        max-width: 14ch;
      }

      .summary-copy,
      .status-copy,
      .address,
      .description,
      .detail-address,
      .detail-description,
      .room-card p {
        color: var(--app-muted);
      }

      .chip-row,
      .amenity-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip,
      .amenity,
      .metric,
      .rank {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .chip,
      .amenity {
        padding: 8px 12px;
        background: rgba(20, 33, 61, 0.06);
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 4px;
        margin-top: 18px;
      }

      .results-grid {
        display: grid;
        gap: 18px;
        margin-top: 22px;
      }

      .result-card,
      .detail-panel,
      .empty-state {
        border: 1px solid var(--app-line);
        border-radius: 24px;
        background: var(--app-panel);
        box-shadow: var(--app-shadow);
        backdrop-filter: blur(14px);
      }

      .result-card {
        padding: 18px;
      }

      .result-topline,
      .result-actions,
      .detail-header,
      .room-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .rank {
        padding: 7px 11px;
        background: var(--app-accent);
        color: white;
      }

      .metric {
        padding: 7px 11px;
        background: var(--app-accent-soft);
        color: var(--app-accent);
      }

      .result-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        margin: 18px 0;
      }

      .result-copy {
        display: grid;
        gap: 10px;
      }

      .result-copy h2,
      .detail-header h3 {
        font-size: 1.45rem;
      }

      .result-meta,
      .detail-grid {
        display: grid;
        gap: 12px;
      }

      .stat,
      .detail-stat {
        min-width: 120px;
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(20, 33, 61, 0.08);
      }

      .stat-label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.78rem;
        color: var(--app-muted);
      }

      .primary-button,
      .ghost-button {
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
      }

      .primary-button {
        background: var(--app-ink);
        color: white;
      }

      .ghost-button {
        background: rgba(20, 33, 61, 0.08);
        color: var(--app-ink);
      }

      .detail-panel {
        margin-top: 22px;
        padding: 18px;
      }

      .detail-panel[hidden] {
        display: none;
      }

      .detail-content {
        display: grid;
        gap: 18px;
      }

      .room-list {
        display: grid;
        gap: 12px;
      }

      .room-card {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(20, 33, 61, 0.08);
        display: grid;
        gap: 8px;
      }

      .empty-state {
        padding: 24px;
      }

      .detail-loading,
      .detail-error {
        padding: 12px 0;
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100vw - 20px, 1120px);
          padding-top: 12px;
        }

        .hero,
        .result-card,
        .detail-panel {
          border-radius: 20px;
        }

        .status-bar,
        .result-body,
        .detail-header,
        .room-topline {
          grid-template-columns: 1fr;
          flex-direction: column;
          align-items: flex-start;
        }

        .result-meta,
        .detail-grid {
          width: 100%;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div id="summary"></div>
      </section>

      <section class="status-bar">
        <p id="status" class="status-copy"></p>
      </section>

      <section id="results" class="results-grid"></section>

      <aside id="detail" class="detail-panel" hidden>
        <div id="detail-content" class="detail-content"></div>
      </aside>
    </main>

    <script type="module" src="./quest-app.ts"></script>
  </body>
</html>
